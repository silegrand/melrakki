<svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .s{stroke:#38D8FF;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round;}
      .d{stroke:#2FB6DC;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;opacity:.85;}
      .a{fill:#5CE8FF;}
      .warm{stroke:#5CE8FF;stroke-width:1.5;stroke-linecap:round;fill:none;opacity:.9;}
      .t{fill:#8FE1F5;font-family:'Segoe UI',Arial,sans-serif;font-size:11px;letter-spacing:.04em;}
      .lead{stroke:#4EC9E8;stroke-width:1;opacity:.7;}
    </style>
  </defs>

  <!-- ground -->
  <ellipse cx="150" cy="356" rx="98" ry="8" fill="#38D8FF" opacity="0.10"/>
  <line class="d" x1="40" y1="356" x2="260" y2="356"/>

  <g filter="url(#g)">
    <!-- skid base -->
    <path class="s" d="M66,320 L234,320 L234,346 L66,346 Z"/>
    <path class="d" d="M90,333 L116,333 L116,343 L90,343 Z"/>
    <path class="d" d="M184,333 L210,333 L210,343 L184,343 Z"/>

    <!-- enclosure: battery (left) + generator (right) -->
    <path class="s" d="M84,250 L216,250 L216,320 L84,320 Z"/>
    <line class="s" x1="150" y1="250" x2="150" y2="320"/>

    <!-- battery side -->
    <line class="d" x1="96" y1="266" x2="128" y2="266"/>
    <line class="d" x1="96" y1="273" x2="128" y2="273"/>
    <path class="d" d="M100,286 L134,286 L134,304 L100,304 Z"/>
    <line class="d" x1="134" y1="290" x2="138" y2="290"/><line class="d" x1="134" y1="300" x2="138" y2="300"/>
    <path class="a" d="M114,289 l-4,7 h4 l-4,6" stroke="#5CE8FF" stroke-width="1.4" fill="none"/>

    <!-- generator side -->
    <line class="d" x1="160" y1="264" x2="204" y2="264"/>
    <line class="d" x1="160" y1="270" x2="204" y2="270"/>
    <line class="d" x1="160" y1="276" x2="204" y2="276"/>
    <circle class="s" cx="172" cy="298" r="9"/>
    <circle class="d" cx="172" cy="298" r="3"/>
    <path class="d" d="M186,290 L206,290 L206,308 L186,308 Z"/>
    <text class="t" x="190" y="302" style="font-size:9px;fill:#5CE8FF;font-weight:bold">HVO</text>

    <!-- exhaust stack + emissions -->
    <path class="s" d="M208,250 L208,232 L216,232"/>
    <path class="warm" d="M220,228 q6,-6 0,-12 q-6,-6 0,-12"/>
    <path class="warm" d="M228,230 q6,-6 0,-12 q-6,-6 0,-12" opacity="0.6"/>

    <!-- mast -->
    <line class="s" x1="146" y1="250" x2="146" y2="98"/>
    <line class="s" x1="154" y1="250" x2="154" y2="98"/>
    <line class="d" x1="146" y1="212" x2="154" y2="212"/>
    <line class="d" x1="146" y1="166" x2="154" y2="166"/>

    <!-- solar array -->
    <path class="s" d="M66,148 L232,128 L240,164 L74,184 Z"/>
    <line class="d" x1="122" y1="141" x2="130" y2="177"/>
    <line class="d" x1="178" y1="135" x2="186" y2="171"/>
    <line class="d" x1="70" y1="166" x2="236" y2="146"/>
    <line class="d" x1="150" y1="174" x2="150" y2="166"/>
    <line class="d" x1="134" y1="176" x2="148" y2="170"/>
    <line class="d" x1="166" y1="172" x2="152" y2="168"/>

    <!-- camera head -->
    <line class="s" x1="116" y1="96" x2="184" y2="96"/>
    <path class="s" d="M104,90 L124,90 L124,110 L104,110 Z"/>
    <circle class="a" cx="114" cy="100" r="3.4"/>
    <path class="d" d="M176,92 L192,92 L192,104 L176,104 Z"/>
    <circle class="a" cx="184" cy="98" r="2"/>
    <line class="d" x1="150" y1="98" x2="150" y2="90"/>
  </g>

  <!-- sun accent -->
  <g opacity="0.9">
    <circle class="s" cx="48" cy="58" r="11"/>
    <g class="d">
      <line x1="48" y1="40" x2="48" y2="45"/><line x1="48" y1="71" x2="48" y2="76"/>
      <line x1="30" y1="58" x2="35" y2="58"/><line x1="61" y1="58" x2="66" y2="58"/>
      <line x1="35" y1="45" x2="39" y2="49"/><line x1="57" y1="67" x2="61" y2="71"/>
      <line x1="61" y1="45" x2="57" y2="49"/><line x1="39" y1="67" x2="35" y2="71"/>
    </g>
  </g>

  <!-- HVO generator callout -->
  <line class="lead" x1="206" y1="288" x2="246" y2="250"/>
  <text class="t" x="208" y="240" style="fill:#5CE8FF">onboard HVO</text>
  <text class="t" x="208" y="254" style="fill:#5CE8FF">generator</text>

  <!-- labels -->
  <text class="t" x="18" y="116">PTZ camera</text>
  <line class="lead" x1="104" y1="100" x2="70" y2="112"/>
  <text class="t" x="102" y="374" style="font-size:12px;letter-spacing:.08em;fill:#5CE8FF;font-family:'IBM Plex Mono',monospace">MK-HK-H6</text>
</svg>

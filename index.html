document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rgin:0;} a{color:inherit;text-decoration:none;}\n  img{max-width:100%;}\n  .wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--pad);}\n  .section{padding-block:var(--sy);}\n\n  /* themes */\n  .t-light{background:var(--snow);color:var(--slate-l);}\n  .t-ice{background:var(--ice);color:var(--slate-l);}\n  .t-dark{background:var(--navy);color:var(--text);}\n  .t-deep{background:radial-gradient(120% 90% at 50% 0%, #0A2338 0%, var(--navy-900) 72%);color:var(--text);}\n  .t-dark h1,.t-dark h2,.t-dark h3,.t-deep h1,.t-deep h2,.t-deep h3{color:#fff;}\n\n  .eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan-ink);margin:0 0 1.3rem;}\n  .t-dark .eyebrow,.t-deep .eyebrow{color:var(--cyan);}\n  .mono{font-family:'IBM Plex Mono',monospace;}\n  .section-head{max-width:60ch;}\n  .section-head h2{font-size:clamp(1.7rem,3.4vw,2.55rem);}\n  .lead{font-size:clamp(1rem,1.4vw,1.15rem);margin-top:1.3rem;max-width:62ch;}\n\n  /* buttons */\n  .btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;padding:.85rem 1.65rem;border-radius:var(--r);border:1px solid transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s,box-shadow .2s;}\n  .btn-primary{background:var(--cyan);color:#04121C;}\n  .btn-primary:hover{background:var(--aqua);box-shadow:0 6px 22px rgba(0,180,220,.4);}\n  .btn-secondary{background:transparent;border-color:rgba(12,34,51,.26);color:var(--ink);}\n  .btn-secondary:hover{border-color:var(--cyan-ink);color:var(--cyan-ink);}\n  .t-dark .btn-secondary,.t-deep .btn-secondary,.cta .btn-secondary{border-color:rgba(122,140,163,.5);color:var(--mist);}\n  .t-dark .btn-secondary:hover,.t-deep .btn-secondary:hover,.cta .btn-secondary:hover{border-color:var(--cyan);color:var(--cyan);}\n\n  /* header */\n  header{position:sticky;top:0;z-index:60;background:rgba(5,17,28,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--navy-700);}\n  .nav{display:flex;align-items:center;justify-content:space-between;height:74px;}\n  .brand img{height:44px;width:auto;display:block;}\n  .nav-links{display:flex;align-items:center;gap:2rem;list-style:none;margin:0;padding:0;}\n  .nav-links a{font-size:.92rem;font-weight:500;color:var(--mist);transition:color .2s;}\n  .nav-links a:hover{color:var(--cyan);}\n  .nav-cta{margin-left:.4rem;}\n  .nav-toggle{display:none;background:none;border:0;cursor:pointer;padding:.4rem;}\n  .nav-toggle span{display:block;width:24px;height:2px;background:var(--mist);margin:5px 0;transition:.25s;}\n\n  /* hero (snow) */\n  .hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#05121F 0%,#082238 58%,#0A2E45 100%);}\n  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center;}\n  .hero h1{font-size:clamp(2.4rem,5.6vw,4.4rem);max-width:15ch;color:#fff;}\n  .hero-sub{font-weight:300;font-size:clamp(1.05rem,1.7vw,1.3rem);color:var(--mist);max-width:46ch;margin:1.6rem 0 2.4rem;line-height:1.55;}\n  .hero-actions{display:flex;flex-wrap:wrap;gap:1rem;}\n  .hero-visual{position:relative;display:flex;justify-content:center;align-items:center;min-height:360px;}\n  .aurora{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none;}\n  .hero > .wrap{position:relative;z-index:1;}\n  .au-drift{animation:auDrift 16s ease-in-out infinite;transform-origin:center;}\n  .au-stars{animation:auTwinkle 7s ease-in-out infinite;}\n  .au-core{animation:auPulse 6s ease-in-out infinite;}\n  .hero-fox{width:min(300px,64%);position:relative;z-index:2;filter:drop-shadow(0 0 22px rgba(90,224,255,.55)) drop-shadow(0 10px 26px rgba(6,20,34,.4));}\n  @keyframes auDrift{0%,100%{transform:translateX(-8px);}50%{transform:translateX(10px);}}\n  @keyframes auTwinkle{0%,100%{opacity:.75;}50%{opacity:1;}}\n  @keyframes auPulse{0%,100%{opacity:.8;}50%{opacity:1;}}\n\n  /* split (problem / approach) */\n  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(2rem,5vw,4.5rem);align-items:start;}\n  .kicker{font-weight:600;font-size:.9rem;color:var(--cyan-ink);}\n  .t-dark .kicker,.t-deep .kicker{color:var(--cyan);}\n\n  /* pillars (ice) */\n  .pillars-head{margin-bottom:clamp(2.4rem,5vw,3.4rem);}\n  .pillars{display:grid;grid-template-columns:repeat(4,1fr);}\n  .pillar{padding:0 1.6rem;border-left:1px solid var(--ice-line);}\n  .pillar:first-child{padding-left:0;border-left:0;}\n  .pillar .glyph{width:34px;height:34px;color:var(--cyan-ink);margin-bottom:1.2rem;}\n  .pillar h3{font-size:1.1rem;margin-bottom:.65rem;color:var(--ink);}\n  .pillar p{font-size:.95rem;line-height:1.6;}\n\n  /* platforms (polar night, glowing schematics) */\n  .plat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:clamp(2.4rem,5vw,3.2rem);}\n  .plat{background:var(--navy-800);border:1px solid var(--navy-700);border-radius:var(--r);padding:1.8rem 1.9rem 2rem;display:flex;flex-direction:column;}\n  .plat-figure{display:flex;justify-content:center;align-items:flex-end;padding:.5rem 0 1.5rem;min-height:250px;}\n  .plat-figure img{height:236px;width:auto;filter:drop-shadow(0 0 10px rgba(0,212,255,.22));}\n  .plat-name{font-size:1.3rem;font-weight:700;color:#fff;}\n  .plat-code{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--cyan);margin-top:.35rem;letter-spacing:.06em;}\n  .plat-tier{font-weight:600;color:var(--aqua);margin:1.05rem 0 .5rem;font-size:.98rem;}\n  .plat-desc{font-size:.95rem;color:var(--text);line-height:1.6;}\n  .spec{list-style:none;margin:1.4rem 0 0;padding:1.3rem 0 0;border-top:1px solid var(--navy-700);display:grid;gap:.6rem;}\n  .spec li{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;}\n  .spec .k{color:var(--slate);font-weight:500;font-size:.86rem;}\n  .spec .v{font-family:'IBM Plex Mono',monospace;color:var(--cyan);text-align:right;font-size:.82rem;}\n  .status{margin-top:1.2rem;display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:600;letter-spacing:.06em;color:var(--slate);text-transform:uppercase;}\n  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}\n  .plat.wide{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(1.5rem,4vw,3rem);align-items:center;}\n  .plat.wide .plat-figure{min-height:auto;padding:1rem 0;}\n  .plat.wide .plat-figure img{height:220px;}\n  .plat-actions{margin-top:clamp(2rem,4vw,2.8rem);display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;}\n  .plat-note{font-size:.8rem;color:var(--slate);font-family:'IBM Plex Mono',monospace;}\n\n  /* sectors (snow) */\n  .priority{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:clamp(2.2rem,4vw,3rem);}\n  .pcard{border:1px solid var(--ice-line);border-radius:var(--r);padding:1.8rem 1.6rem;background:var(--white);box-shadow:0 12px 30px rgba(12,34,51,.05);}\n  .pcard .num{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--cyan-ink);}\n  .pcard h3{font-size:1.18rem;margin-top:.8rem;color:var(--ink);}\n  .also{margin-top:2.6rem;padding-top:2rem;border-top:1px solid var(--ice-line);}\n  .also .also-label{color:var(--slate-l);font-size:.9rem;margin-bottom:1rem;}\n  .also ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.7rem 1.4rem;}\n  .also li{font-size:.95rem;position:relative;padding-left:1.1rem;}\n  .also li::before{content:\"\";position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--cyan-ink);}\n\n  /* pedigree (polar night) */\n  .pedigree .inner{max-width:70ch;border-left:2px solid var(--cyan);padding-left:clamp(1.4rem,3vw,2.4rem);}\n  .pedigree h2{font-size:clamp(1.8rem,3.6vw,2.7rem);}\n  .pedigree p{margin-top:1.4rem;font-size:clamp(1.02rem,1.5vw,1.2rem);color:var(--mist);line-height:1.6;}\n\n  /* story (snow) */\n  .story-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4rem);align-items:center;}\n  .story h2{font-size:clamp(1.7rem,3.4vw,2.5rem);}\n  .story p{margin-top:1.3rem;max-width:52ch;}\n  .story-fox{display:flex;justify-content:center;}\n  .story-fox img{width:min(240px,66%);filter:drop-shadow(0 12px 26px rgba(12,34,51,.16));}\n\n  /* cta (aurora) */\n  .cta{background:linear-gradient(120deg,#0A2135,#0b3a55 55%,#0e506f);}\n  .cta .wrap{text-align:center;display:flex;flex-direction:column;align-items:center;}\n  .cta h2{color:#fff;font-size:clamp(1.9rem,4.4vw,3.2rem);}\n  .cta p{margin:1.3rem auto 2.3rem;max-width:48ch;color:var(--mist);font-size:1.1rem;font-weight:300;}\n\n  /* footer (polar night) */\n  footer{background:var(--navy-900);border-top:1px solid var(--navy-700);padding-block:clamp(3rem,6vw,4.5rem) 2rem;}\n  .foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:2.5rem;}\n  .foot-brand img{width:210px;height:auto;margin-bottom:1.3rem;}\n  .foot-brand p{font-size:.92rem;color:var(--slate);max-width:44ch;line-height:1.6;}\n  .foot-strap{margin-top:1.3rem;font-weight:600;color:#fff;letter-spacing:.02em;}\n  .foot-col h4{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);margin:0 0 1.1rem;font-weight:600;}\n  .foot-col ul{list-style:none;margin:0;padding:0;display:grid;gap:.7rem;}\n  .foot-col a{font-size:.92rem;color:var(--text);}\n  .foot-col a:hover{color:var(--cyan);}\n  .foot-bottom{margin-top:3rem;padding-top:1.6rem;border-top:1px solid var(--navy-700);display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;align-items:center;}\n  .foot-bottom p{font-size:.82rem;color:var(--slate);}\n  .foot-desc{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--cyan);letter-spacing:.03em;}\n\n  a:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--cyan-ink);outline-offset:3px;border-radius:2px;}\n\n  @media (max-width:900px){\n    .hero-grid{grid-template-columns:1fr;gap:2rem;} .hero-visual{order:-1;min-height:230px;}\n    .split{grid-template-columns:1fr;gap:1.6rem;}\n    .pillars{grid-template-columns:repeat(2,1fr);gap:2.4rem 0;} .pillar{padding:0 1.4rem;} .pillar:nth-child(3){padding-left:0;border-left:0;}\n    .plat-grid{grid-template-columns:1fr;} .plat.wide{grid-column:auto;grid-template-columns:1fr;}\n    .priority{grid-template-columns:1fr;}\n    .story-grid{grid-template-columns:1fr;} .story-fox{order:-1;}\n    .foot-grid{grid-template-columns:1fr;gap:2rem;}\n    .nav-links{position:absolute;top:74px;left:0;right:0;flex-direction:column;align-items:flex-start;gap:0;background:var(--navy-800);border-bottom:1px solid var(--navy-700);padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease;}\n    .nav-links.open{max-height:440px;}\n    .nav-links li{width:100%;border-top:1px solid var(--navy-700);}\n    .nav-links li:first-child{border-top:0;}\n    .nav-links a{display:block;padding:1rem var(--pad);width:100%;}\n    .nav-cta{margin:1rem var(--pad);}\n    .nav-toggle{display:block;}\n  }\n  @media (max-width:520px){\n    .pillars{grid-template-columns:1fr;} .pillar{padding-left:0;border-left:0;}\n    .hero-actions{flex-direction:column;align-items:stretch;} .hero-actions .btn{justify-content:center;}\n  }\n  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} .au-drift,.au-stars,.au-core{animation:none !important;} *{transition:none !important;} }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<header>\n  <div class=\"wrap nav\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"Melrakki Systems home\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjAAAACdCAYAAACq7EJ2AAEAAElEQVR4nOz9eXxl13XfiX7X3udOuJirABCokcVikVXgZJUoSqJtgpYSW3Zk2YpQihzH8SjHw3PHaXc6Trq7UP1ed/JeOul+jqyOFFuWndiyC/KQKLE8yGbRMi3SEmRSJECxWCwWa0IBKEwXuMAdzl6r/9jnXqBIShZF2rJpLH4uUcA94z5n7/3ba/3Wb8FfhJnJX8hxd+xL206b79iO7diO7diOvQa2M6H+5dlOW+/Yju3Yju3Yjr06e2DZet+4snII4KSZ+1pfz+vesjY+ulgfvWt2bTD72w6g2bEd27Ed27HXtb12ACObNDep9XlX/uWvq1ZHTonoDoj5i7Px0+YR0dsv146I2s+lTnbaesd2bMd2bMd27BVZBlTevFa/863B7L615meOzc11bv9ux15Dy9r00HNLPccWG08cnauG2+fXh7d/t2M7tmM7tmM79nq112yiG58khi2CG0o3UvW ection class=\"section t-ice\" id=\"pillars\">\n  <div class=\"wrap\">\n    <div class=\"section-head pillars-head\"><h2>Built to run on its own.<\u002Fh2><\u002Fdiv>\n    <div class=\"pillars\">\n      <div class=\"pillar\">\n        <svg class=\"glyph\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"16\" r=\"4\"><\u002Fcircle><path d=\"M16 3v4M16 25v4M3 16h4M25 16h4M7 7l3 3M22 22l3 3M25 7l-3 3M10 22l-3 3\"><\u002Fpath><\u002Fsvg>\n        <h3>Autonomy. It runs without you.<\u002Fh3>\n        <p>No grid, no fuel convoy, no site visits. Solar and battery power sized to the load, so the platform holds while you are somewhere else.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\">\n        <svg class=\"glyph\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3l11 4v8c0 7-5 11-11 14C10 26 5 22 5 15V7z\"><\u002Fpath><\u002Fsvg>\n        <h3>Endurance. It holds in the worst conditions.<\u002Fh3>\n        <p>Each platform is engineered for the specific extreme it faces. Where uptime cannot be risked, clean solar sits in front of fuelled backup.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\">\n        <svg class=\"glyph\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"3\"><\u002Fcircle><circle cx=\"24\" cy=\"8\" r=\"3\"><\u002Fcircle><circle cx=\"16\" cy=\"24\" r=\"3\"><\u002Fcircle><path d=\"M10.5 9.5l4 12M21.5 9.5l-4 12M11 8h10\"><\u002Fpath><\u002Fsvg>\n        <h3>Engineering. Designed from the load backwards.<\u002Fh3>\n        <p>Our own platform architecture, with proven components inside. Sized to the mission, not picked off a catalogue.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\">\n        <svg class=\"glyph\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2L16 25.5 9.5 23l1.3-7.2-5.3-5.1 7.3-1z\"><\u002Fpath><path d=\"M12 19l3 3 5-6\"><\u002Fpath><\u002Fsvg>\n        <h3>Pedigree. Proven where it matters.<\u002Fh3>\n        <p>More than a decade deploying off-grid solar surveillance into some of the most demanding sectors there are.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PLATFORMS (polar night, glowing schematics) -->\n<section class=\"section t-deep\" id=\"platforms\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">The platforms<\u002Fp>\n      <h2>Two power tiers, one engineering standard.<\u002Fh2>\n      <p class=\"lead\">Two power tiers built on the same engineering, and a den for the drones that return to charge. Concept schematics shown; each tower is supplied ready for your own cameras, sensors and radios.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"plat-grid\">\n      <article class=\"plat\">\n        <div class=\"plat-figure\"><img src=\"data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMzAwIDM4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiBmaWxsPSJub25lIj4KICA8ZGVmcz4KICAgIDxmaWx0ZXIgaWQ9ImciIHg9Ii0zMCUiIHk9Ii0zMCUiIHdpZHRoPSIxNjAlIiBoZWlnaHQ9IjE2MCUiPgogICAgICA8ZmVHYXVzc2lhbkJsdXIgc3RkRGV2aWF0aW9uPSIxLjYiIHJlc3VsdD0iYiIvPgogICAgICA8ZmVNZXJnZT48ZmVNZXJnZU5vZGUgaW49ImIiLz48ZmVNZXJnZU5vZGUgaW49IlNvdXJjZUdyYXBoaWMiLz48L2ZlTWVyZ2U+CiAgICA8L2ZpbHRlcj4KICAgIDxzdHlsZT4KICAgICAgLnN7c3Ryb2tlOiMzOEQ4RkY7c3Ryb2tlLXdpZHRoOjIuMTtzdHJva2UtbGluZWpvaW46cm91bmQ7c3Ryb2tlLWxpbmVjYXA6cm91bmQ7fQogICAgICAuZHtzdHJva2U6IzJGQjZEQztzdHJva2Utd2lkdGg6MS4zO3N0cm9rZS1saW5lam9pbjpyb3VuZDtzdHJva2UtbGluZWNhcDpyb3VuZDtvcGFjaXR5Oi44NTt9CiAgICAgIC5he2ZpbGw6IzVDRThGRjt9CiAgICAgIC53YXJte3N0cm9rZTojNUNFOEZGO3N0 Fdiv>\n      <div class=\"pcard\"><span class=\"num mono\">02<\u002Fspan><h3>Defence and public sector<\u002Fh3><\u002Fdiv>\n      <div class=\"pcard\"><span class=\"num mono\">03<\u002Fspan><h3>Extreme and hostile-location sites<\u002Fh3><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"also\">\n      <p class=\"also-label\">We also power<\u002Fp>\n      <ul>\n        <li>Security and surveillance<\u002Fli><li>Telecommunications and remote networks<\u002Fli>\n        <li>Critical national infrastructure<\u002Fli><li>Border and perimeter security<\u002Fli>\n        <li>Remote construction<\u002Fli><li>Emergency and disaster response<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PEDIGREE (polar night) -->\n<section class=\"section t-dark pedigree\" id=\"pedigree\">\n  <div class=\"wrap\">\n    <div class=\"inner\">\n      <h2>This is not a first attempt.<\u002Fh2>\n      <p>The team behind Melrakki has spent more than a decade designing and deploying off-grid solar surveillance into demanding sectors, from oil and gas to highways, construction and critical infrastructure, long before the work carried this name. Melrakki is that experience, engineered into platforms of its own.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- STORY (snow) -->\n<section class=\"section t-light story\" id=\"story\">\n  <div class=\"wrap story-grid\">\n    <div>\n      <p class=\"eyebrow\">Why the fox<\u002Fp>\n      <h2>The only animal that thrives unaided through the polar winter.<\u002Fh2>\n      <p>Iceland's only native land mammal is the Arctic fox, melrakki, an animal that thrives through the polar winter with no shelter and no resupply, entirely on its own resources. We build power that behaves the same way.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"story-fox\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MTMgNDc3IiB3aWR0aD0iNDEzIiBoZWlnaHQ9IjQ3NyIgcm9sZT0iaW1nIiB

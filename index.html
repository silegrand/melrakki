<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #010e1e; /* Matches the darkest tone of the logo */
        }
        img {
            max-width: 50vw;
            max-height: 50vh;
            mix-blend-mode: screen; /* Blends the image background into the body background */
        }
    </style>
</head>
<body>
    <img src="Melrakki Master Logo.jpg" alt="Melrakki Systems Logo">
</body>
</html>

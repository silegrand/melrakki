<svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .s{stroke:#38D8FF;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round;}
      .d{stroke:#2FB6DC;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;opacity:.85;}
      .a{fill:#5CE8FF;}
      .t{fill:#8FE1F5;font-family:'Segoe UI',Arial,sans-serif;font-size:11px;letter-spacing:.04em;}
      .lead{stroke:#4EC9E8;stroke-width:1;opacity:.7;}
    </style>
  </defs>

  <!-- ground -->
  <ellipse cx="150" cy="356" rx="98" ry="8" fill="#38D8FF" opacity="0.10"/>
  <line class="d" x1="40" y1="356" x2="260" y2="356"/>

  <g filter="url(#g)">
    <!-- skid base -->
    <path class="s" d="M70,320 L230,320 L230,346 L70,346 Z"/>
    <path class="d" d="M92,333 L118,333 L118,343 L92,343 Z"/>
    <path class="d" d="M182,333 L208,333 L208,343 L182,343 Z"/>

    <!-- battery enclosure -->
    <path class="s" d="M88,262 L212,262 L212,320 L88,320 Z"/>
    <line class="d" x1="150" y1="262" x2="150" y2="320"/>
    <line class="d" x1="100" y1="276" x2="132" y2="276"/>
    <line class="d" x1="100" y1="283" x2="132" y2="283"/>
    <line class="d" x1="100" y1="290" x2="132" y2="290"/>
    <!-- battery glyph -->
    <path class="d" d="M162,286 L196,286 L196,302 L162,302 Z"/>
    <line class="d" x1="196" y1="290" x2="200" y2="290"/><line class="d" x1="196" y1="298" x2="200" y2="298"/>
    <path class="a" d="M176,289 l-4,7 h4 l-4,6" stroke="#5CE8FF" stroke-width="1.4" fill="none"/>

    <!-- mast -->
    <line class="s" x1="146" y1="262" x2="146" y2="98"/>
    <line class="s" x1="154" y1="262" x2="154" y2="98"/>
    <line class="d" x1="146" y1="222" x2="154" y2="222"/>
    <line class="d" x1="146" y1="170" x2="154" y2="170"/>

    <!-- solar array (tilted, book-opening, 3 panels) -->
    <path class="s" d="M66,150 L232,130 L240,166 L74,186 Z"/>
    <line class="d" x1="122" y1="143" x2="130" y2="179"/>
    <line class="d" x1="178" y1="137" x2="186" y2="173"/>
    <line class="d" x1="70" y1="168" x2="236" y2="148"/>
    <!-- bracket to mast -->
    <line class="d" x1="150" y1="176" x2="150" y2="170"/>
    <line class="d" x1="134" y1="178" x2="148" y2="172"/>
    <line class="d" x1="166" y1="174" x2="152" y2="170"/>

    <!-- camera head -->
    <line class="s" x1="116" y1="96" x2="184" y2="96"/>
    <path class="s" d="M104,90 L124,90 L124,110 L104,110 Z"/>
    <circle class="a" cx="114" cy="100" r="3.4"/>
    <path class="d" d="M176,92 L192,92 L192,104 L176,104 Z"/>
    <circle class="a" cx="184" cy="98" r="2"/>
    <line class="d" x1="150" y1="98" x2="150" y2="90"/>
  </g>

  <!-- sun accent -->
  <g opacity="0.9">
    <circle class="s" cx="48" cy="60" r="12"/>
    <g class="d">
      <line x1="48" y1="40" x2="48" y2="46"/><line x1="48" y1="74" x2="48" y2="80"/>
      <line x1="28" y1="60" x2="34" y2="60"/><line x1="62" y1="60" x2="68" y2="60"/>
      <line x1="34" y1="46" x2="38" y2="50"/><line x1="58" y1="70" x2="62" y2="74"/>
      <line x1="62" y1="46" x2="58" y2="50"/><line x1="38" y1="70" x2="34" y2="74"/>
    </g>
  </g>

  <!-- height dimension -->
  <line class="lead" x1="258" y1="98" x2="258" y2="346"/>
  <path class="lead" d="M254,102 L258,96 L262,102"/>
  <path class="lead" d="M254,342 L258,348 L262,342"/>
  <text class="t" x="266" y="226">6 m</text>

  <!-- labels -->
  <line class="lead" x1="240" y1="148" x2="270" y2="138"/>
  <text class="t" x="212" y="132">solar array</text>
  <line class="lead" x1="104" y1="100" x2="70" y2="112"/>
  <text class="t" x="18" y="116">PTZ camera</text>
  <text class="t" x="102" y="374" style="font-size:12px;letter-spacing:.08em;fill:#5CE8FF;font-family:'IBM Plex Mono',monospace">MK-HK-S6</text>
</svg>
